<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧排版與文書系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 mammoth.js 用來在前端直接解析 Word (.docx) 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm border-b border-gray-200 py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">✨ AI 智慧排版與文書系統</h1>
        <div class="text-sm text-gray-500">GitHub Pages Ready</div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：控制面板 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-1 space-y-6">
            
            <!-- 模式選擇 -->
            <div>
                <h2 class="text-lg font-semibold border-b pb-2 mb-3">1. 選擇處理模式</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-slide" class="p-3 text-center rounded-lg border border-blue-500 bg-blue-50 text-blue-600 font-medium transition" onclick="switchMode('slide')">
                        🎨 簡報模式
                    </button>
                    <button id="btn-doc" class="p-3 text-center rounded-lg border border-gray-200 text-gray-600 font-medium transition hover:bg-gray-50" onclick="switchMode('doc')">
                        📄 論文模式
                    </button>
                </div>
            </div>

            <!-- API Key 設定 -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <label class="text-sm font-medium text-gray-700">您的 Gemini API Key</label>
                    <button onclick="clearApiKey()" class="text-xs text-red-500 hover:text-red-700 underline">清除金鑰</button>
                </div>
                <input type="password" id="api-key-input" placeholder="請輸入 Google AI Studio 金鑰" class="w-full text-sm border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
            </div>

            <!-- 資料來源切換區 -->
            <div>
                <h2 class="text-lg font-semibold border-b pb-2 mb-3">2. 匯入原始資料</h2>
                
                <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg mb-4">
                    <button id="tab-file" onclick="switchInputSource('file')" class="flex-1 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-blue-600">📂 上傳檔案</button>
                    <button id="tab-text" onclick="switchInputSource('text')" class="flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700">📝 直接貼上</button>
                    <button id="tab-url" onclick="switchInputSource('url')" class="flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700">🔗 網路連結</button>
                </div>

                <!-- 輸入區 1：上傳檔案 (支援 docx 了！) -->
                <div id="source-file" class="space-y-2 block">
                    <label class="text-sm font-medium text-gray-700">上傳本機檔案 (.txt / .md / .docx)</label>
                    <input type="file" id="file-input" accept=".txt,.md,.html,.docx" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                    <p class="text-xs text-gray-400">現在支援直接上傳 Word 檔了！</p>
                </div>

                <!-- 輸入區 2：直接貼上 (最適合 Google Docs) -->
                <div id="source-text" class="space-y-2 hidden">
                    <label class="text-sm font-medium text-gray-700">貼上雲端文件內容 (類 ibon 最快解法)</label>
                    <textarea id="text-input" rows="5" placeholder="無法直接抓 Google 雲端？沒關係！直接將 Google Docs 的內容全選複製，貼到這裡即可立刻排版！" class="w-full text-sm border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"></textarea>
                </div>

                <!-- 輸入區 3：網址抓取 -->
                <div id="source-url" class="space-y-2 hidden">
                    <label class="text-sm font-medium text-gray-700">輸入公開純文字網址</label>
                    <input type="url" id="url-input" placeholder="https://..." class="w-full text-sm border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
            </div>

            <button onclick="startAIParsing()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition shadow-md mt-4">
                🚀 開始 Gemini AI 智慧排版
            </button>
        </section>

        <!-- 右側：預覽畫布 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2 flex flex-col">
            <div class="flex justify-between items-center border-b pb-2 mb-4">
                <h2 id="preview-title" class="text-lg font-semibold">即時預覽 (簡報模式 - 16:9 智慧圖文)</h2>
            </div>
            <div id="preview-container" class="flex-1 bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center p-4 min-h-[450px] overflow-auto">
                <p class="text-gray-400 text-sm text-center">準備就緒！<br>支援直接上傳 Word 檔 (.docx)，或直接貼上雲端文件內容！</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
